<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

#niraviewer {
  width: 100%;
  height: 100%;
  border: 0;
}
</style>

<script src="https://sdk.nira.app/js/viewer.js"></script>

</head>

<body>

<iframe
  id="niraviewer"
  src="https://nidaros.nira.app/g/y-93qFDYS2W-8ACrlqVj8A">
</iframe>

<script>

/* ==================================================
   STATE
================================================== */

let viewerReady = false;
let pendingUuid = null;
let fileMakerUuidList = [];


/* ==================================================
   INIT VIEWER
================================================== */

let viewer = new NiraAPI.Viewer(
  document.getElementById("niraviewer"),
  {
    showNavigationTools: true,
    showMeasureTool: true,
    showCalloutsList: true,
    showRenderModes: true,
    suppressCalloutDialog: true
  }
);


/* ==================================================
   MODEL READY
================================================== */

viewer.on("asset_load_finish", function () {

  viewerReady = true;

  /*
     Hvis FileMaker allerede har sendt listen
     før modellen var ferdig lastet, bruker vi den nå.
  */

  if (fileMakerUuidList.length > 0) {

    viewer.setCalloutVisibilities(fileMakerUuidList);

  } else {

    /*
       Ingen liste fra FileMaker ennå.
       Skjul alle callouts.
    */

    viewer.setCalloutVisibilities([]);

  }

  if (pendingUuid) {

    activateCalloutSafe(pendingUuid);
    pendingUuid = null;

  }

});


/* ==================================================
   SAFE CALLOUT ACTIVATION
================================================== */

function activateCalloutSafe(uuid) {

  try {

    if (viewer.activateCalloutLabelOrUuid) {

      viewer.activateCalloutLabelOrUuid(uuid);
      return;

    }

    if (viewer.activateCallout) {

      viewer.activateCallout(uuid);
      return;

    }

    if (viewer.setSessionState) {

      viewer.setSessionState({
        activeCallout: uuid
      });

      return;

    }

    console.log("No supported activation method found.");

  } catch (e) {

    console.log("Activation failed:", e);

  }

}


/* ==================================================
   FileMaker → Viewer
   Activate single callout
================================================== */

function activateFromFileMaker(uuid) {

  if (!uuid) return;

  if (!viewerReady) {

    pendingUuid = uuid;
    return;

  }

  activateCalloutSafe(uuid);

}


/* ==================================================
   FileMaker → Viewer
   FILTER CALLOUTS
================================================== */

function filterCallouts(uuidList) {

  try {

    const ids = JSON.parse(uuidList);

    fileMakerUuidList = ids;

    if (!viewerReady) {
      return;
    }

    function applyFilter() {

      viewer.setSessionState({
        showCallouts: ids.length > 0,
        showMeasurements: false
      });

      viewer.setCalloutVisibilities(ids);

    }

    // Kjør med en gang
    applyFilter();

    // Kjør igjen etter at NIRA har fått tid til å oppdatere scenen
    setTimeout(applyFilter, 500);
    setTimeout(applyFilter, 1500);

  } catch (e) {

    console.log("Filter error:", e);

  }

}

/* ==================================================
   SHOW ALL CALLOUTS
================================================== */

function showAllCallouts() {

  if (!viewerReady) return;

  viewer.getCallouts().then(function(callouts) {

    const ids = callouts.map(function(callout) {
      return callout.uuid;
    });

    viewer.setCalloutVisibilities(ids);

  });

}


/* ==================================================
   NEW CALLOUT
================================================== */

viewer.on("callout_created", function(info) {

  if (!info || !info.uuid) return;

  /*
     Send UUID to FileMaker.
     FileMaker oppretter Callout-recorden.
  */

  sendToFileMaker(info.uuid);

});


/* ==================================================
   CALLOUT ACTIVATED
================================================== */

viewer.on("callout_activated", function(info) {

  if (!info || !info.uuid) return;

  sendToFileMaker(info.uuid);

});


/* ==================================================
   Bridge
   NIRA → FileMaker
================================================== */

function sendToFileMaker(uuid) {

  if (!uuid) return;

  try {

    if (typeof FileMaker !== "undefined") {

      if (FileMaker.PerformScriptWithOption) {

        FileMaker.PerformScriptWithOption(
          "Test_From_nira",
          uuid,
          0
        );

        return;

      }

      if (FileMaker.PerformScript) {

        FileMaker.PerformScript(
          "Test_From_nira",
          uuid
        );

        return;

      }

    }

    console.log("FileMaker bridge not available");

  } catch (e) {

    console.log("Bridge error:", e);

  }

}


/* ==================================================
   DEBUG
================================================== */

function testPing() {

  viewer.setSessionState({
    showCallouts: true,
    showMeasurements: false
  });

  viewer.setCalloutVisibilities([
    "aded0e6c-a6b1-4368-b48f-812de189d170"
  ]);

}
