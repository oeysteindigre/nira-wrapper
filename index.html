<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  touch-action: none;
}

#niraviewer {
  position: absolute;
  top: -60px;
  left: 0;
  width: 100%;
  height: calc(100% + 160px);
  border: 0;
}

/* ÅRSTALL-LEGENDE */

#yearLegend {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 12px;
  height: 20px;
  z-index: 100;
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: #333;
  pointer-events: none;
  display: none;
}

#yearLegendBar {
  position: absolute;
  left: 38px;
  right: 38px;
  top: 5px;
  height: 10px;
  border-radius: 5px;
  background: linear-gradient(
    to right,
    rgb(255,60,0),
    rgb(255,255,0)
  );
}

#yearLegendLabels {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#yearLegendLabels span {
  background: rgba(255,255,255,0.75);
  padding: 0 2px;
}

/* HØYDEKURVE */

#yearLegendCurve {
  position: absolute;
  left: 38px;
  right: 38px;
  top: -22px;
  height: 28px;
  width: calc(100% - 76px);
  pointer-events: none;
}

</style>

<script src="https://sdk.nira.app/js/viewer.js"></script>

</head>

<body>

<!-- ÅRSTALL-LEGENDE -->

<div id="yearLegend">

  <canvas id="yearLegendCurve"></canvas>

  <div id="yearLegendBar"></div>

  <div id="yearLegendLabels">
    <span id="yearLegendMin"></span>
    <span id="yearLegendMax"></span>
  </div>

</div>


<iframe
  id="niraviewer"
  src="https://nidaros.nira.app/g/y-93qFDYS2W-8ACrlqVj8A">
</iframe>


<script>

let viewerReady = false;
let pendingUuid = null;
let pendingCalloutIds = null;
let allCalloutIds = [];
let linkingMode = false;


function startLinkingMode() {
  linkingMode = true;
}


/* NIRA VIEWER */

let viewer = new NiraAPI.Viewer(
  document.getElementById("niraviewer"),
  {
    showNavigationTools: false,
    showOrbitTool: true,
    showPanTool: false,
    showZoomTool: false,
    showMeasureTool: true,
    showCalloutsList: false,
    showRenderModes: false,
    showViewSettings: false,
    showDayNightRain: false,

    showFullscreenButton: false,
    suppressCalloutDialog: true
  }
);


/* MODEL READY */

viewer.on("asset_load_finish", function () {

  viewerReady = true;


  /* HVIT BAKGRUNN */

  viewer.setSessionState({
    bgType: "Color",
    bgColor: {
      x: 1,
      y: 1,
      z: 1
    }
  });


  setTimeout(function () {

    viewer.setSessionState({
      bgType: "Color",
      bgColor: {
        x: 1,
        y: 1,
        z: 1
      }
    });

  }, 1000);


  /* AKTIVER VENTENDE CALLOUT */

  if (pendingUuid) {

    activateCalloutSafe(pendingUuid);

    pendingUuid = null;

  }


  /* VIS VENTENDE CALLOUTS */

  if (pendingCalloutIds) {

    viewer.setSessionState({

      showCallouts: pendingCalloutIds.length > 0,

      showMeasurements: false

    });

    viewer.setCalloutVisibilities(pendingCalloutIds);

    pendingCalloutIds = null;

  }


  /* SEND CALLOUT-LISTE TIL FILEMAKER */

  if (typeof FileMaker !== "undefined") {

    FileMaker.PerformScript(
      "NIRA_Send_Callout_List",
      ""
    );

  }

});


/* ACTIVATE CALLOUT */

function activateCalloutSafe(uuid) {

  if (!uuid) return;


  if (!viewerReady) {

    pendingUuid = uuid;

    return;

  }


  try {

    viewer.activateCallout(uuid, {

      transitionStyle: "GoToBookmark",

      matchField: "uuid"

    });

  }

  catch (e) {

    console.log(
      "activateCallout error:",
      e
    );

  }

}


/* FILEMAKER → NIRA */

function activateFromFileMaker(uuid) {

  console.log(
    "NIRA mottok:",
    uuid
  );


  if (!uuid) {

    console.log(
      "Ingen UUID"
    );

    return;

  }


  if (!viewerReady) {

    console.log(
      "Viewer ikke klar"
    );

    pendingUuid = uuid;

    return;

  }


  console.log(
    "Kaller activateCallout"
  );


  viewer.activateCallout(uuid);


  console.log(
    "activateCallout ferdig"
  );

}


/* RENDER MODE */

function setRenderMode(mode) {

  if (!viewerReady) return;


  viewer.setSessionState({

    renderMode: mode

  });

}


/* TOOL MODE */

function setToolMode(mode) {

  if (mode === "Orbit") {

    viewer.setToolMode(
      NiraAPI.Toolmode.Orbit
    );

  }

  else if (mode === "Callout") {

    viewer.setToolMode(
      NiraAPI.Toolmode.Callout
    );

  }

}


/* ÅRSTALL-LEGENDE */

function updateYearLegend(minYear, maxYear) {

  const legend =
    document.getElementById(
      "yearLegend"
    );

  const minLabel =
    document.getElementById(
      "yearLegendMin"
    );

  const maxLabel =
    document.getElementById(
      "yearLegendMax"
    );


  if (!legend) return;


  if (
    !Number.isFinite(minYear) ||
    !Number.isFinite(maxYear)
  ) {

    legend.style.display = "none";

    return;

  }


  minLabel.textContent =
    minYear;

  maxLabel.textContent =
    maxYear;


  legend.style.display =
    "block";

}


/* HØYDEKURVE */

function updateYearCurve(
  callouts,
  minYear,
  maxYear
) {

  const canvas =
    document.getElementById(
      "yearLegendCurve"
    );

  if (!canvas) return;


  const rect =
    canvas.getBoundingClientRect();


  const width =
    Math.max(
      1,
      Math.round(rect.width)
    );


  const height =
    Math.max(
      1,
      Math.round(rect.height)
    );


  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    width * dpr;

  canvas.height =
    height * dpr;


  const ctx =
    canvas.getContext("2d");


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if (
    !Number.isFinite(minYear) ||
    !Number.isFinite(maxYear) ||
    callouts.length === 0
  ) {

    return;

  }


  /*
   * 40 intervaller langs tidsaksen.
   */

  const bins = 40;

  const counts =
    new Array(bins).fill(0);


  callouts.forEach(function(item) {

    const year =
      Number(item.year);


    if (
      !Number.isFinite(year) ||
      year <= 0
    ) {

      return;

    }


    let position = 0;


    if (maxYear !== minYear) {

      position =
        (year - minYear) /
        (maxYear - minYear);

    }


    position =
      Math.max(
        0,
        Math.min(1, position)
      );


    const index =
      Math.min(
        bins - 1,
        Math.floor(
          position * bins
        )
      );


    counts[index]++;

  });


  const maxCount =
    Math.max(...counts);


  if (maxCount === 0) return;


  /*
   * Litt glatting av kurven.
   */

  const smooth =
    counts.map(function(
      value,
      index
    ) {

      const prev =
        counts[index - 1] ?? value;

      const next =
        counts[index + 1] ?? value;


      return (
        prev * 0.25 +
        value * 0.5 +
        next * 0.25
      );

    });


  /*
   * Maksimal høyde.
   */

  const maxHeight = 25;

  const points = [];


  for (
    let i = 0;
    i < bins;
    i++
  ) {

    const x =
      (i / (bins - 1)) *
      width;


    const normalized =
      smooth[i] / maxCount;


    const y =
      height -
      normalized * maxHeight;


    points.push({
      x: x,
      y: y
    });

  }


  /*
   * Fyll området under kurven.
   */

  ctx.beginPath();

  ctx.moveTo(
    0,
    height
  );


  points.forEach(function(point) {

    ctx.lineTo(
      point.x,
      point.y
    );

  });


  ctx.lineTo(
    width,
    height
  );


  ctx.closePath();


  ctx.fillStyle =
    "rgba(80,80,80,0.16)";

  ctx.fill();


  /*
   * Selve kurven.
   */

  ctx.beginPath();


  points.forEach(function(
    point,
    index
  ) {

    if (index === 0) {

      ctx.moveTo(
        point.x,
        point.y
      );

    }

    else {

      ctx.lineTo(
        point.x,
        point.y
      );

    }

  });


  ctx.strokeStyle =
    "rgba(60,60,60,0.35)";

  ctx.lineWidth = 1.5;

  ctx.stroke();

}


/* FILTER CALLOUTS */

function filterCallouts(data) {

  try {

    const callouts =
      JSON.parse(data);


    const ids =
      callouts.map(
        item => item.uuid
      );


    if (!viewerReady) {

      pendingCalloutIds = ids;

      return;

    }


    viewer.setSessionState({

      showCallouts:
        ids.length > 0,

      showMeasurements:
        false

    });


    viewer.setCalloutVisibilities(
      ids
    );


    /* FINN ÅRSTALL */

    const years =
      callouts

        .map(
          item => Number(item.year)
        )

        .filter(
          year =>
            Number.isFinite(year) &&
            year > 0
        );


    if (years.length === 0) {

      document.getElementById(
        "yearLegend"
      ).style.display = "none";

      return;

    }


    const minYear =
      Math.min(...years);


    const maxYear =
      Math.max(...years);


    /* OPPDATER LEGENDE */

    updateYearLegend(
      minYear,
      maxYear
    );


    /* OPPDATER HØYDEKURVE */

    requestAnimationFrame(function() {

      updateYearCurve(
        callouts,
        minYear,
        maxYear
      );

    });


    /* FARGELEGG CALLOUTS */

    callouts.forEach(item => {

      const year =
        Number(item.year);


      if (
        !Number.isFinite(year) ||
        year <= 0
      ) {

        return;

      }


      let position = 0.5;


      if (
        maxYear !== minYear
      ) {

        position =
          (year - minYear) /
          (maxYear - minYear);

      }


      let r;
      let g;
      let b;


      r = 255;

      g =
        Math.round(
          60 + 195 * position
        );

      b = 0;


      try {

        viewer.updateCallout(

          item.uuid,

          {

            viewColor: [
              r,
              g,
              b
            ]

          }

        );

      }

      catch (e) {

        console.log(

          "Kunne ikke fargelegge callout:",

          item.uuid,

          e

        );

      }

    });

  }

  catch (e) {

    console.log(
      "Filter error:",
      e
    );

  }

}


/* NIRA → FILEMAKER */

viewer.on(
  "callout_created",
  function(info) {

    if (
      !info ||
      !info.uuid
    ) return;


    if (linkingMode) {

      FileMaker.PerformScript(

        "NIRA_Koble_Valgt_Registrering",

        info.uuid

      );


      linkingMode = false;

      return;

    }


    sendToFileMaker(
      info.uuid
    );

  }
);


viewer.on(
  "callout_activated",
  function(info) {

    if (
      info &&
      info.uuid
    ) {

      sendToFileMaker(
        info.uuid
      );

    }

  }
);


/* SEND TIL FILEMAKER */

function sendToFileMaker(uuid) {

  if (!uuid) return;


  try {

    if (
      typeof FileMaker !==
      "undefined"
    ) {


      if (
        FileMaker.PerformScriptWithOption
      ) {

        FileMaker.PerformScriptWithOption(

          "Test_From_nira",

          uuid,

          0

        );

        return;

      }


      if (
        FileMaker.PerformScript
      ) {

        FileMaker.PerformScript(

          "Test_From_nira",

          uuid

        );

        return;

      }

    }


    console.log(
      "FileMaker bridge not available"
    );

  }

  catch (e) {

    console.log(
      "Bridge error:",
      e
    );

  }

}

</script>

</body>
</html>
