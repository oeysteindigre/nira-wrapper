<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  touch-action: none;
}

#niraviewer {
  position: absolute;
  top: -60px;
  left: 0;
  width: 100%;
  height: calc(100% + 160px);
  border: 0;
}

/* ÅRSTALL-LEGENDE */

#yearLegend {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 12px;
  height: 20px;
  overflow: visible;
  z-index: 100;
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: #333;
  pointer-events: none;
  display: none;
}

/*
 * Den gamle rette fargeskalaen skjules.
 * Fargeskalaen tegnes nå av canvaset,
 * slik at tykkelsen kan variere.
 */

#yearLegendBar {
  display: none;
}


/* FARGESKALA MED REGISTRERINGSTETTHET */

#yearLegendCurve {
  position: absolute;
  left: 38px;
  right: 38px;
  top: -35px;
  height: 45px;
  width: calc(100% - 76px);
  pointer-events: none;
}


/* ÅRSTALL */

#yearLegendLabels {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#yearLegendLabels span {
  background: rgba(255,255,255,0.75);
  padding: 0 2px;
}

</style>

<script src="https://sdk.nira.app/js/viewer.js"></script>

</head>

<body>

<!-- ÅRSTALL-LEGENDE -->

<div id="yearLegend">

  <canvas id="yearLegendCurve"></canvas>

  <div id="yearLegendBar"></div>

  <div id="yearLegendLabels">
    <span id="yearLegendMin"></span>
    <span id="yearLegendMax"></span>
  </div>

</div>


<iframe
  id="niraviewer"
  src="https://nidaros.nira.app/g/y-93qFDYS2W-8ACrlqVj8A">
</iframe>


<script>

let viewerReady = false;
let pendingUuid = null;
let pendingCalloutIds = null;
let allCalloutIds = [];
let linkingMode = false;


function startLinkingMode() {
  linkingMode = true;
}


/* NIRA VIEWER */

let viewer = new NiraAPI.Viewer(
  document.getElementById("niraviewer"),
  {
    showNavigationTools: false,
    showOrbitTool: true,
    showPanTool: false,
    showZoomTool: false,
    showMeasureTool: true,
    showCalloutsList: false,
    showRenderModes: false,
    showViewSettings: false,
    showDayNightRain: false,

    showFullscreenButton: false,
    suppressCalloutDialog: true
  }
);


/* MODEL READY */

viewer.on("asset_load_finish", function () {

  viewerReady = true;


  /* HVIT BAKGRUNN */

  viewer.setSessionState({
    bgType: "Color",
    bgColor: {
      x: 1,
      y: 1,
      z: 1
    }
  });


  setTimeout(function () {

    viewer.setSessionState({
      bgType: "Color",
      bgColor: {
        x: 1,
        y: 1,
        z: 1
      }
    });

  }, 1000);


  /* AKTIVER VENTENDE CALLOUT */

  if (pendingUuid) {

    activateCalloutSafe(pendingUuid);

    pendingUuid = null;

  }


  /* VIS VENTENDE CALLOUTS */

  if (pendingCalloutIds) {

    viewer.setSessionState({

      showCallouts: pendingCalloutIds.length > 0,

      showMeasurements: false

    });

    viewer.setCalloutVisibilities(pendingCalloutIds);

    pendingCalloutIds = null;

  }


  /* SEND CALLOUT-LISTE TIL FILEMAKER */

  if (typeof FileMaker !== "undefined") {

    FileMaker.PerformScript(
      "NIRA_Send_Callout_List",
      ""
    );

  }

});


/* ACTIVATE CALLOUT */

function activateCalloutSafe(uuid) {

  if (!uuid) return;


  if (!viewerReady) {

    pendingUuid = uuid;

    return;

  }


  try {

    viewer.activateCallout(uuid, {

      transitionStyle: "GoToBookmark",

      matchField: "uuid"

    });

  }

  catch (e) {

    console.log(
      "activateCallout error:",
      e
    );

  }

}


/* FILEMAKER → NIRA */

function activateFromFileMaker(uuid) {

  console.log(
    "NIRA mottok:",
    uuid
  );


  if (!uuid) {

    console.log(
      "Ingen UUID"
    );

    return;

  }


  if (!viewerReady) {

    console.log(
      "Viewer ikke klar"
    );

    pendingUuid = uuid;

    return;

  }


  console.log(
    "Kaller activateCallout"
  );


  viewer.activateCallout(uuid);


  console.log(
    "activateCallout ferdig"
  );

}


/* RENDER MODE */

function setRenderMode(mode) {

  if (!viewerReady) return;


  viewer.setSessionState({

    renderMode: mode

  });

}


/* TOOL MODE */

function setToolMode(mode) {

  if (mode === "Orbit") {

    viewer.setToolMode(
      NiraAPI.Toolmode.Orbit
    );

  }

  else if (mode === "Callout") {

    viewer.setToolMode(
      NiraAPI.Toolmode.Callout
    );

  }

}


/* ÅRSTALL-LEGENDE */

function updateYearLegend(minYear, maxYear) {

  const legend =
    document.getElementById(
      "yearLegend"
    );

  const minLabel =
    document.getElementById(
      "yearLegendMin"
    );

  const maxLabel =
    document.getElementById(
      "yearLegendMax"
    );


  if (!legend) return;


  if (
    !Number.isFinite(minYear) ||
    !Number.isFinite(maxYear)
  ) {

    legend.style.display = "none";

    return;

  }


  minLabel.textContent =
    minYear;

  maxLabel.textContent =
    maxYear;


  legend.style.display =
    "block";

}


/* FARGESKALA MED REGISTRERINGSTETTHET */

function updateYearCurve(
  callouts,
  minYear,
  maxYear
) {

  const canvas =
    document.getElementById(
      "yearLegendCurve"
    );

  if (!canvas) return;


  const rect =
    canvas.getBoundingClientRect();


  const width =
    Math.max(
      1,
      Math.round(rect.width)
    );


  const height =
    Math.max(
      1,
      Math.round(rect.height)
    );


  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    width * dpr;

  canvas.height =
    height * dpr;


  const ctx =
    canvas.getContext("2d");


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if (
    !Number.isFinite(minYear) ||
    !Number.isFinite(maxYear) ||
    callouts.length === 0
  ) {
    return;
  }


  /*
   * Flere intervaller gir et mer
   * detaljert grunnlag for kurven.
   */

  const bins = 80;

  const counts =
    new Array(bins).fill(0);


  /*
   * Tell registreringene.
   */

  callouts.forEach(function(item) {

    const year =
      Number(item.year);


    if (
      !Number.isFinite(year) ||
      year <= 0
    ) {
      return;
    }


    let position = 0;


    if (maxYear !== minYear) {

      position =
        (year - minYear) /
        (maxYear - minYear);

    }


    position =
      Math.max(
        0,
        Math.min(1, position)
      );


    const index =
      Math.min(
        bins - 1,
        Math.floor(
          position * bins
        )
      );


    counts[index]++;

  });


  const maxCount =
    Math.max(...counts);


  if (maxCount === 0) return;


  /*
   * Kraftig glatting.
   *
   * Hvert punkt påvirkes av flere
   * punkter på hver side.
   */

  const smooth =
    counts.map(function(value, index) {

      let total = 0;
      let weightTotal = 0;


      for (
        let offset = -4;
        offset <= 4;
        offset++
      ) {

        const i =
          index + offset;


        if (
          i < 0 ||
          i >= bins
        ) {
          continue;
        }


        /*
         * Gauss-lignende vekting.
         * Nærmeste punkt får mest vekt.
         */

        const weight =
          Math.exp(
            -(offset * offset) / 5
          );


        total +=
          counts[i] * weight;


        weightTotal +=
          weight;

      }


      return (
        total /
        weightTotal
      );

    });


  /*
   * Minimumstykkelse.
   * Kurven går aldri helt ned til null.
   */

  const minHeight = 6;


  /*
   * Maksimal høyde.
   */

  const maxHeight = 45;


  /*
   * Nederste kant.
   */

  const baseline =
    height - 3;


  const points = [];


  for (
    let i = 0;
    i < bins;
    i++
  ) {

    const x =
      (i / (bins - 1)) *
      width;


    const normalized =
      smooth[i] / maxCount;


    const curveHeight =
      minHeight +
      normalized *
      (maxHeight - minHeight);


    const y =
      baseline -
      curveHeight;


    points.push({
      x: x,
      y: y
    });

  }


  /*
   * Tegn en virkelig glatt kurve
   * gjennom punktene.
   */

  ctx.beginPath();


  ctx.moveTo(
    points[0].x,
    baseline
  );


  ctx.lineTo(
    points[0].x,
    points[0].y
  );


  for (
    let i = 0;
    i < points.length - 1;
    i++
  ) {

    const current =
      points[i];

    const next =
      points[i + 1];


    const midpointX =
      (current.x + next.x) / 2;


    const midpointY =
      (current.y + next.y) / 2;


    ctx.quadraticCurveTo(

      current.x,
      current.y,

      midpointX,
      midpointY

    );

  }


  /*
   * Siste punkt.
   */

  const last =
    points[points.length - 1];


  ctx.quadraticCurveTo(

    last.x,
    last.y,

    last.x,
    last.y

  );


  /*
   * Ned til baseline.
   */

  ctx.lineTo(
    width,
    baseline
  );


  ctx.closePath();


  /*
   * Samme rød → gul gradient
   * som callouts.
   */

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      width,
      0
    );


  gradient.addColorStop(
    0,
    "rgba(255,60,0,0.90)"
  );


  gradient.addColorStop(
    1,
    "rgba(255,255,0,0.90)"
  );


  ctx.fillStyle =
    gradient;


  ctx.fill();

}  

/* FILTER CALLOUTS */

function filterCallouts(data) {

  try {

    const callouts =
      JSON.parse(data);


    const ids =
      callouts.map(
        item => item.uuid
      );


    if (!viewerReady) {

      pendingCalloutIds = ids;

      return;

    }


    viewer.setSessionState({

      showCallouts:
        ids.length > 0,

      showMeasurements:
        false

    });


    viewer.setCalloutVisibilities(
      ids
    );


    /* FINN ÅRSTALL */

    const years =
      callouts

        .map(
          item => Number(item.year)
        )

        .filter(
          year =>
            Number.isFinite(year) &&
            year > 0
        );


    if (years.length === 0) {

      document.getElementById(
        "yearLegend"
      ).style.display = "none";

      return;

    }


    const minYear =
      Math.min(...years);


    const maxYear =
      Math.max(...years);


    /* OPPDATER LEGENDE */

    updateYearLegend(
      minYear,
      maxYear
    );


    /* OPPDATER FARGESKALA MED TETTHET */

    requestAnimationFrame(function() {

      updateYearCurve(
        callouts,
        minYear,
        maxYear
      );

    });


    /* FARGELEGG CALLOUTS */

    callouts.forEach(item => {

      const year =
        Number(item.year);


      if (
        !Number.isFinite(year) ||
        year <= 0
      ) {

        return;

      }


      let position = 0.5;


      if (
        maxYear !== minYear
      ) {

        position =
          (year - minYear) /
          (maxYear - minYear);

      }


      let r;
      let g;
      let b;


      r = 255;

      g =
        Math.round(
          60 + 195 * position
        );

      b = 0;


      try {

        viewer.updateCallout(

          item.uuid,

          {

            viewColor: [
              r,
              g,
              b
            ]

          }

        );

      }

      catch (e) {

        console.log(

          "Kunne ikke fargelegge callout:",

          item.uuid,

          e

        );

      }

    });

  }

  catch (e) {

    console.log(
      "Filter error:",
      e
    );

  }

}


/* NIRA → FILEMAKER */

viewer.on(
  "callout_created",
  function(info) {

    if (
      !info ||
      !info.uuid
    ) return;


    if (linkingMode) {

      FileMaker.PerformScript(

        "NIRA_Koble_Valgt_Registrering",

        info.uuid

      );


      linkingMode = false;

      return;

    }


    sendToFileMaker(
      info.uuid
    );

  }
);


viewer.on(
  "callout_activated",
  function(info) {

    if (
      info &&
      info.uuid
    ) {

      sendToFileMaker(
        info.uuid
      );

    }

  }
);


/* SEND TIL FILEMAKER */

function sendToFileMaker(uuid) {

  if (!uuid) return;


  try {

    if (
      typeof FileMaker !==
      "undefined"
    ) {


      if (
        FileMaker.PerformScriptWithOption
      ) {

        FileMaker.PerformScriptWithOption(

          "Test_From_nira",

          uuid,

          0

        );

        return;

      }


      if (
        FileMaker.PerformScript
      ) {

        FileMaker.PerformScript(

          "Test_From_nira",

          uuid

        );

        return;

      }

    }


    console.log(
      "FileMaker bridge not available"
    );

  }

  catch (e) {

    console.log(
      "Bridge error:",
      e
    );

  }

}

</script>

</body>
</html>
