<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  touch-action: none;
}

#niraviewer {
  width: 100%;
  height: 100%;
  border: 0;
}
</style>

<script src="https://sdk.nira.app/js/viewer.js"></script>

</head>

<body>

<iframe
  id="niraviewer"
  src="https://nidaros.nira.app/g/y-93qFDYS2W-8ACrlqVj8A">
</iframe>

<script>

let viewerReady = false;
let pendingUuid = null;
let pendingCalloutIds = null;
let allCalloutIds = [];
let linkingMode = false;

function startLinkingMode() {
  linkingMode = true;
}
  
let viewer = new NiraAPI.Viewer(
  document.getElementById("niraviewer"),
  {
    showNavigationTools: false,
    showOrbitTool: true,
    showPanTool: false,
    showZoomTool: false,
    showMeasureTool: true,
    showCalloutsList: false,
    showRenderModes: false,
    showViewSettings: false,
    showDayNightRain: false,

    showFullscreenButton: false,
    suppressCalloutDialog: true
  }
);


/* MODEL READY */

viewer.on("asset_load_finish", function () {

  viewerReady = true;


  
  // TVING HVIT BAKGRUNN
  viewer.setSessionState({
    bgType: "Color",
    bgColor: {
      x: 1,
      y: 1,
      z: 1
    }
  });
  
  setTimeout(function () {
    viewer.setSessionState({
      bgType: "Color",
      bgColor: {
        x: 1,
        y: 1,
        z: 1
      }
    });
  }, 1000);
  
  if (pendingUuid) {
    activateCalloutSafe(pendingUuid);
    pendingUuid = null;
  }

  if (pendingCalloutIds) {

    viewer.setSessionState({
      showCallouts: pendingCalloutIds.length > 0,
      showMeasurements: false
    });

    viewer.setCalloutVisibilities(pendingCalloutIds);

    pendingCalloutIds = null;
  }

  if (typeof FileMaker !== "undefined") {

    FileMaker.PerformScript(
      "NIRA_Send_Callout_List",
      ""
    );

  }

});

/* ACTIVATE CALLOUT */

function activateCalloutSafe(uuid) {

  if (!uuid) return;

  if (!viewerReady) {
    pendingUuid = uuid;
    return;
  }

  try {

    viewer.activateCallout(uuid, {
      transitionStyle: "GoToBookmark",
      matchField: "uuid"
    });

  } catch (e) {

    console.log("activateCallout error:", e);

  }

}



/* FILEMAKER → NIRA */

function activateFromFileMaker(uuid) {

  if (!uuid) return;

  if (!viewerReady) {
    pendingUuid = uuid;
    return;
  }

  try {

    // Sørg for at callouten er synlig
    viewer.setCalloutVisibilities([uuid]);

    // Aktiver callouten etter at synligheten er satt
    setTimeout(function () {

      viewer.activateCallout(uuid);

    }, 100);

  } catch (e) {

    console.log("NIRA navigation error:", e);

  }

}
  
function setRenderMode(mode) {
  if (!viewerReady) return;

  viewer.setSessionState({
    renderMode: mode
  });
}

function setToolMode(mode) {
    if (mode === "Orbit") {
        viewer.setToolMode(NiraAPI.Toolmode.Orbit);
    } else if (mode === "Callout") {
        viewer.setToolMode(NiraAPI.Toolmode.Callout);
    }
}  
  
/* FILTER CALLOUTS */

/* FILTER CALLOUTS */

function filterCallouts(data) {

  try {

    const callouts = JSON.parse(data);

    const ids = callouts.map(item => item.uuid);

    if (!viewerReady) {
      pendingCalloutIds = ids;
      return;
    }

    viewer.setSessionState({
      showCallouts: ids.length > 0,
      showMeasurements: false
    });

    viewer.setCalloutVisibilities(ids);

   const years = callouts
  .map(item => Number(item.year))
  .filter(year => Number.isFinite(year) && year > 0);

    if (years.length === 0) {
      return;
    }

    const minYear = Math.min(...years);
    const maxYear = Math.max(...years);

    callouts.forEach(item => {

      const year = Number(item.year);

      if (!Number.isFinite(year) || year <= 0) {
        return;
      }

      let position = 0.5;

      if (maxYear !== minYear) {
        position = (year - minYear) / (maxYear - minYear);
      }

     let r;
let g;
let b;

r = 255;
g = Math.round(60 + 195 * position);
b = 0;

      try {

        viewer.updateCallout(
          item.uuid,
          {
            viewColor: [r, g, b]
          }
        );

      } catch (e) {

        console.log(
          "Kunne ikke fargelegge callout:",
          item.uuid,
          e
        );

      }

    });

  } catch (e) {

    console.log("Filter error:", e);

  }

}


/* NIRA → FILEMAKER */

viewer.on("callout_created", function(info) {

  if (!info || !info.uuid) return;

  if (linkingMode) {

    FileMaker.PerformScript(
      "NIRA_Koble_Valgt_Registrering",
      info.uuid
    );

    linkingMode = false;
    return;
  }

  sendToFileMaker(info.uuid);

});


viewer.on("callout_activated", function(info) {

  if (info && info.uuid) {
    sendToFileMaker(info.uuid);
  }

});


function sendToFileMaker(uuid) {

  if (!uuid) return;

  try {

    if (typeof FileMaker !== "undefined") {

      if (FileMaker.PerformScriptWithOption) {

        FileMaker.PerformScriptWithOption(
          "Test_From_nira",
          uuid,
          0
        );

        return;
      }

      if (FileMaker.PerformScript) {

        FileMaker.PerformScript(
          "Test_From_nira",
          uuid
        );

        return;
      }

    }

    console.log("FileMaker bridge not available");

  } catch (e) {

    console.log("Bridge error:", e);

  }

}

</script>

</body>
</html>
